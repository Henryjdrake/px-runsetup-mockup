          sub={cfd ? 'AI surrogate or imported dataset' : 'Independent of CFD — can run on its own'}
          on={enabled[node.id] !== false} onChange={() => toggleEnabled(node.id)} />
        {cfd
          ? <Info>Choose how this run gets its CFD field in <b>Data source</b> below — predict with the AI surrogate, or import a real CFD dataset.</Info>
          : <Info>FEA does not require a CFD result. Enable any combination of thermal, mechanical and fatigue below.</Info>}
      </>);
    }
    if (t === 'aimodel') {
      // "Data source" node: a run gets its physics field either from the AI
      // surrogate (inference) or from an imported real CFD/FEA dataset. The
      // choice is per-run (`source`); importing keeps everything local.
      const isFea = node.id === 'fea-model';
      const datasetNoun = isFea ? 'FEA dataset' : 'CFD dataset';
      const accept = isFea ? '.vtu,.vtk,.csv' : '.vtu,.vtk,.cgns,.csv';
      const sampleFile = isFea ? 'fea_results_e40.vtu' : 'cfd_baseline_e40.vtu';
      const sampleField = isFea ? 'von Mises stress' : 'Temperature';
      const today = '2026-05-31';
      const onFile = (e) => {
        try {
          const f = e.target.files && e.target.files[0]; if (!f) return;
          // Field exports are large binary files — register locally (no upload).
          actions.importCfd({ fileName: f.name, field: sampleField, importedAt: today, cells: '—' });
          e.target.value = '';
        } catch (err) { console.error('[aimodel.onFile] CRASH:', err.message, err.stack); }
      };
      return (<>
        <Field label="Data source" required>
          <div className="seg">
            <button className={'seg-btn' + (source !== 'cfd' ? ' sel' : '')} onClick={() => actions.setRunSource('ai')}>AI inference</button>
            <button className={'seg-btn' + (source === 'cfd' ? ' sel' : '')} onClick={() => actions.setRunSource('cfd')}>{datasetNoun}</button>
          </div>
        </Field>
        {source !== 'cfd' ? (<>
          <Field label="Surrogate model"><FakeSelect value={isFea ? 'FEA Surrogate v2' : 'CFD Surrogate v4'} /></Field>
          <Field label="Version"><FakeSelect value={isFea ? '2025.4 (stable)' : '2026.1 (stable)'} /></Field>
          <Readouts rows={[['Validation MAE', isFea ? '3.4%' : '2.1%'], ['Trained on', isFea ? '8.9k runs' : '12.4k runs']]} />
          <Info>The surrogate predicts the {isFea ? 'structural' : 'flow'} field from the boundary conditions below. Switch to {datasetNoun} to bring in measured / simulated ground truth instead.</Info>
        </>) : cfd ? (<>
          <Field label={datasetNoun}>
            <div className="input-row">
              <div className="fake-select" style={{ flex: 1, cursor: 'default' }}><span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}><Icon name="dataset" style={{ fontSize: 16 }} />{cfd.fileName}</span></div>
              <label className="btn-sm" style={{ cursor: 'pointer' }}>Replace<input type="file" accept={accept} style={{ display: 'none' }} onChange={onFile} /></label>
            </div>
          </Field>
          <Readouts rows={[['Field', cfd.field || sampleField], ['Imported', cfd.importedAt || today], ['Mesh cells', cfd.cells || '—']]} />
          <Info>The boundary conditions below are the operating point this dataset was simulated at — they define what this run is compared against. Edit them to record the as-run setup.</Info>
          <button className="btn-sm" style={{ width: '100%' }} onClick={() => actions.clearCfd()}><Icon name="close" />Remove dataset</button>
        </>) : (
          <div className="locked">
            <div className="head"><Icon name="dataset" /><p>No {datasetNoun} imported. Upload a field export to use real simulation data for this run instead of an AI prediction.</p></div>
            <div style={{ display: 'flex', gap: 8 }}>
              <label className="btn btn-primary" style={{ cursor: 'pointer', width: 'auto', padding: '0 14px' }}>Upload dataset<input type="file" accept={accept} style={{ display: 'none' }} onChange={onFile} /></label>
              <button className="btn btn-secondary" style={{ width: 'auto', padding: '0 14px' }} onClick={() => actions.importCfd({ fileName: sampleFile, field: sampleField, importedAt: today, cells: '4.2M' })}>Load sample</button>
            </div>
          </div>
        )}
      </>);
    }
    if (t === 'bc-group') {
      const bcs = (node.children || []).map((c) => bcSummary(bcConfig[c.id]) ? c.label : null).filter(Boolean);
      return (<>
        <Readouts rows={[['Conditions', String((node.children || []).length)], ['Sweeps', String((node.children || []).filter((c) => (bcConfig[c.id] || {}).mode === 'sweep').length)]]} />
        <Info>Flow-rate conditions can run a single value or a sweep across a range. Restrictions are defined from an uploaded ΔP-vs-flow curve. Each condition shows its current setting beside its name.</Info>
      </>);
    }
    if (t === 'bc') {
      const cfg = bcConfig[node.id] || {};
      const setBC = (patch) => actions.setBC(node.id, patch);
      if (node.bcKind === 'flow') {
        const sweep = cfg.mode === 'sweep';
        return (<>
          <Info>Set the coolant {node.label.toLowerCase()} for this prediction. Choose a single operating point, or sweep a range to see how the engine responds across environments.</Info>
          <Field label="Inference mode">
            <div className="seg">
              <button className={'seg-btn' + (!sweep ? ' sel' : '')} onClick={() => setBC({ mode: 'single' })}>Single point</button>
              <button className={'seg-btn' + (sweep ? ' sel' : '')} onClick={() => setBC({ mode: 'sweep' })}>Sweep</button>
            </div>
          </Field>
          {!sweep ? (
            <Field label="Flow rate" required>
              <div className="input-row"><NumInput value={cfg.value} min={0} step={0.01} onCommit={(v) => setBC({ value: v })} /><span className="unit">l/s</span></div>
            </Field>
          ) : (
            <>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                <Field label="Range min"><div className="input-row"><NumInput value={cfg.min} min={0} step={0.1} onCommit={(v) => setBC({ min: v })} /><span className="unit">l/s</span></div></Field>
                <Field label="Range max"><div className="input-row"><NumInput value={cfg.max} min={0} step={0.1} onCommit={(v) => setBC({ max: v })} /><span className="unit">l/s</span></div></Field>
              </div>
              <Field label="Increments"><div className="input-row"><NumInput value={cfg.steps} int min={2} max={24} onCommit={(v) => setBC({ steps: v })} /><span className="unit">steps</span></div></Field>
              <SweepPreview min={cfg.min} max={cfg.max} steps={cfg.steps} units="l/s" />
            </>
          )}
          <Field label="Applied surface"><FakeSelect value={node.id === 'bc-pump' ? 'Coolant pump inlet' : 'Auxiliary loop inlet'} /></Field>
        </>);
      }
      if (node.bcKind === 'thermostat') {
        return (<>
          <Info>The thermostat gates coolant flow to the radiator loop. It is a discrete state, not a swept parameter.</Info>
          <ToggleField label="Thermostat" sub={cfg.on ? 'Open — coolant circulates through radiator' : 'Closed — radiator loop bypassed'} on={!!cfg.on} onChange={() => setBC({ on: !cfg.on })} />
        </>);
      }
      // restriction
      const onFile = (e) => {
        const f = e.target.files && e.target.files[0]; if (!f) return;
        const reader = new FileReader();
        reader.onload = () => { const curve = parseCsvCurve(reader.result); if (curve && curve.length > 1) setBC({ fileName: f.name, curve }); };
        reader.readAsText(f); e.target.value = '';
      };
      return (<>
        <Info>Upload a CSV of coolant flow rate vs. pressure drop (ΔP). The component’s hydraulic restriction is interpolated from this curve during inference. Two columns: flow rate (l/s), ΔP (kPa).</Info>
        {cfg.curve ? (<>
          <Field label="Restriction data">
            <div className="input-row">
              <div className="fake-select" style={{ flex: 1, cursor: 'default' }}><span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}><Icon name="description" style={{ fontSize: 16 }} />{cfg.fileName || 'curve.csv'}</span></div>
              <label className="btn-sm" style={{ cursor: 'pointer' }}>Replace<input type="file" accept=".csv,text/csv" style={{ display: 'none' }} onChange={onFile} /></label>
            </div>
          </Field>
          <RestrictionPlot curve={cfg.curve} />
          <Readouts rows={[['Points', String(cfg.curve.length)], ['Flow range', `${cfg.curve[0].q.toFixed(1)}–${cfg.curve[cfg.curve.length - 1].q.toFixed(1)} l/s`], ['ΔP at max flow', `${cfg.curve[cfg.curve.length - 1].dp.toFixed(1)} kPa`]]} />
          <button className="btn-sm" style={{ width: '100%' }} onClick={() => setBC({ fileName: null, curve: null })}><Icon name="close" />Clear curve</button>
        </>) : (
          <div className="locked">
            <div className="head"><Icon name="filter_alt" /><p>No restriction curve for {node.label}. Upload a CSV to define the ΔP-vs-flow relationship.</p></div>
            <div style={{ display: 'flex', gap: 8 }}>
              <label className="btn btn-primary" style={{ cursor: 'pointer', width: 'auto', padding: '0 14px' }}>Upload CSV<input type="file" accept=".csv,text/csv" style={{ display: 'none' }} onChange={onFile} /></label>
              <button className="btn btn-secondary" style={{ width: 'auto', padding: '0 14px' }} onClick={() => setBC({ fileName: 'sample_curve.csv', curve: sampleCurve(0.3) })}>Load sample</button>
            </div>
          </div>
        )}
      </>);
    }
    if (t === 'monitoring') {
      const mons = (monitorsByGroup && monitorsByGroup[node.id]) || [];
      return (<>
        <Info>Each monitor measures a field over a saved slice or probe, sampled across solve iterations. Monitors are scoped to the run’s engine.</Info>
        <Readouts rows={[['Monitors', String(mons.length)], ['Engine scope', engineType.toUpperCase()]]} />
        <button className="btn-sm" style={{ width: '100%' }} onClick={() => actions.addMonitor(node.id)}><Icon name="add" />New monitor</button>
        <button className="btn-sm" style={{ width: '100%' }} onClick={() => actions.openMonitors()}>Open monitors panel</button>
      </>);
    }
    if (t === 'monitor') {
      const m = node._mon || {};
      return (<>
        <Field label="Name" required>
          <NameField value={m.label} onCommit={(name) => actions.renameMonitor(node._group, m.id, name)} />
        </Field>
        <Field label="Field"><FakeSelect value={`${m.field} · ${m.units}`} /></Field>
        <Field label="Reduction"><FakeSelect value={m.reduction} /></Field>
        <div className="sub-head">Location</div>
        <Readouts rows={[
          ['Slice plane', `${(m.axis || 'z').toUpperCase()} @ ${m.pos}mm`],
          ['In-plane extent', m.extent],
          ['Engine scope', (m.engineId || engineType).toUpperCase()],
        ]} />
        <button className="btn-sm" style={{ width: '100%' }} onClick={() => actions.locateMonitor(m)}><Icon name="place" />Show location on geometry</button>
        <Info>This panel defines the monitor request. Measured values, statistics and run-to-run comparison live in the Monitors tab.</Info>
        <button className="btn-sm btn-primary" style={{ width: '100%' }} onClick={() => actions.openMonitors(m.id)}><Icon name="insights" />View results</button>
        <button onClick={() => actions.removeMonitor(node._group, m.id)}
          style={{ background: 'none', border: 'none', color: 'var(--color-key-error)', fontSize: 12, cursor: 'pointer', padding: '2px 0', textAlign: 'left', fontFamily: 'Geist, sans-serif' }}>Remove monitor</button>
      </>);
    }
    if (t === 'fea-analyses') {
      return (<>
        <Info>Toggle each physics independently. Any combination can run in a single prediction.</Info>
        <Readouts rows={[
          ['Thermal', enabled['fea-thermal'] !== false ? 'On' : 'Off'],
          ['Mechanical', enabled['fea-mech'] !== false ? 'On' : 'Off'],
          ['Fatigue', enabled['fea-fatigue'] !== false ? 'On' : 'Off'],
        ]} />
      </>);
    }
    if (t === 'subanalysis') {
      const subs = {
        'fea-thermal': 'Steady-state temperature field across the assembly.',
        'fea-mech': 'Mechanical loads & constraints driving deformation and stress.',
        'fea-fatigue': 'Cyclic-life estimate. Requires mechanical (and optionally thermal) results.',
      };
      return (<>
        <ToggleField label={`Run ${node.label.toLowerCase()} analysis`} sub="Independent on/off"
          on={enabled[node.id] !== false} onChange={() => toggleEnabled(node.id)} />
        <Info>{subs[node.id]}</Info>
      </>);
    }
    if (t === 'stress-group') {
      return (<><Info>Stress is reported separately by load source, so it’s clear which case drives the peak.</Info></>);
    }
    if (t === 'stress') {
      const src = {
        'stress-asm': 'Pre-load from assembly fit & bolt torque only.',
        'stress-thermal': 'Stress induced by the thermal field (CTE mismatch).',
        'stress-mech': 'Stress from applied mechanical loads & constraints.',
      };
      return (<>
        <Field label="Quantity"><FakeSelect value="von Mises (max)" /></Field>
        <Readouts rows={[['Units', 'MPa'], ['Reported', 'Peak + field']]} />
        <Info>{src[node.id]}</Info>
      </>);
    }
    if (t === 'loads') {
      return (<>
        <Field label="Fixed support"><FakeSelect value="Mounting flange" /></Field>
        <Field label="Applied load"><div className="input-row"><input className="input" defaultValue="1500" /><span className="unit">N</span></div></Field>
      </>);
    }
    return <Info>Select an item in the tree to configure it.</Info>;
  } catch (err) {
    console.error('[ConfigBody] CRASH:', err.message, err.stack);
    return <Info>Could not render configuration.</Info>;
  }
}

// Status glyph + color for a run.
const RUN_STATUS = {
  predicted: ['check_circle', 'var(--color-key-success)', 'Predicted'],
  imported:  ['dataset',      'var(--color-key-warning, #F5A623)', 'Imported CFD dataset'],
  running:   ['pending',      'var(--color-key-warning)', 'Running'],
  ready:     ['play_circle',  'var(--color-key-primary)', 'Ready'],
  draft:     ['radio_button_unchecked', 'var(--color-on-surface-subtle)', 'Draft'],
};
function RunStatus({ status }) {
  const [icon, color] = RUN_STATUS[status] || RUN_STATUS.draft;
  return <Icon name={icon} style={{ fontSize: 15, color, flexShrink: 0 }} title={(RUN_STATUS[status] || RUN_STATUS.draft)[2]} />;
}

// A single row in the runs list: compare checkbox + identity + type chip + status + caret.
function RunRow({ run, open, checked, canDelete, onToggleOpen, onToggleSel, onDelete }) {
  try {
    const sb = runSweepBc(run);
    const isSweep = !!sb;
    const isCfd = run.source === 'cfd';
    const nInc = isSweep ? incrementsOf(sb.min, sb.max, sb.steps).length : 0;
    const sub = isCfd
      ? `${run.engineType.toUpperCase()} · imported dataset`
      : isSweep
        ? `${run.engineType.toUpperCase()} · ${sb.param} · ${sweepSummary(run)}`
        : `${run.engineType.toUpperCase()} · single point`;
    return (
      <div className="run-row" onClick={() => onToggleOpen(run.id)}>
        <button className={'run-check' + (checked ? ' on' : '')} title="Select for comparison"
          onClick={(e) => { e.stopPropagation(); onToggleSel(run.id); }}>
          {checked && <Icon name="check" />}
        </button>
        <span className="run-swatch" style={{ background: run.color }} />
        <div className="run-body">
          <div className="run-line1">
            <span className="run-name">{run.name}</span>
            <RunStatus status={run.status} />
          </div>
          <div className="run-line2">
            {isCfd
              ? <span className="run-chip cfd"><Icon name="dataset" />CFD</span>
              : <span className="run-chip"><Icon name="auto_awesome" style={{ fontSize: 11 }} />AI</span>}
            {isSweep && <span className="run-chip sweep"><Icon name="tune" />Sweep · {nInc}</span>}
            <span className="run-sub">{sub}</span>
          </div>
        </div>
        {canDelete && onDelete && (
          <button className="run-del" title="Delete run"
            onClick={(e) => { e.stopPropagation(); onDelete(run.id); }}>
            <Icon name="delete" />
          </button>
        )}
        <Icon name={open ? 'expand_more' : 'chevron_right'} className="run-caret" />
      </div>
    );
  } catch (err) {
    console.error('[RunRow] CRASH:', err.message, err.stack);
    return null;
  }
}

/* Sweep accordion body: the swept parameter's increments. A "View as individual
   runs" toggle promotes each increment to a selectable single-point operand
   (checkbox bound to the shared runSel), so you can pick one inference point to
   compare or delta — you can't delta a whole sweep. */
function SweepIncrements({ run, runSel, onToggleInc }) {
  // Collapsible dropdown (collapsed by default). Each increment is always an
  // individually selectable single-point operand — no separate "view as runs" mode.
  const [open, setOpen] = React.useState(false);
  try {
    const sb = runSweepBc(run);
    if (!sb) return null;
    const incs = incrementRuns(run);
    const selCount = incs.filter((ir) => runSel.has(ir.id)).length;
    return (
      <div className="sweep-incs">
        <button className={'sweep-incs-head' + (open ? ' open' : '')} aria-expanded={open}
          title={open ? 'Hide increments' : 'Show increments'}
          onClick={(e) => { e.stopPropagation(); setOpen((v) => !v); }}>
          <Icon name="expand_more" className={'sweep-incs-chev' + (open ? ' open' : '')} />
          <div className="sweep-incs-head-txt">
            <div className="section-label" style={{ margin: 0 }}>Increments · {incs.length}</div>
            <div className="sweep-incs-sub">{sb.param} · {sb.min}–{sb.max} {sb.units}</div>
          </div>
          {selCount > 0 && <span className="sweep-incs-count">{selCount} selected</span>}
        </button>
        {open && (
          <>
            <div className="list-box" style={{ maxHeight: 168 }}>
              {incs.map((ir) => {
                const on = runSel.has(ir.id);
                return (
                  <div key={ir.id} className={'inc-row' + (on ? ' selected' : '')}
                    onClick={(e) => { e.stopPropagation(); onToggleInc(ir.id); }}>
                    <span className={'check' + (on ? ' on' : '')}>{on && <Icon name="check" />}</span>
                    <span className="inc-swatch" style={{ background: ir.color }} />
                    <span className="label">{ir.shortName}</span>
                    {on && <span className="run-chip" style={{ marginLeft: 'auto', color: 'var(--color-key-primary)', boxShadow: 'inset 0 0 0 1px var(--color-key-primary)', background: 'transparent' }}>delta-ready</span>}
                  </div>
                );
              })}
            </div>
            <div className="sweep-incs-hint">
              <Icon name="call_split" />
              Each increment is a single inference point. Select one (plus another run) to take a delta.
            </div>
          </>
        )}
      </div>
    );
  } catch (err) {
    console.error('[SweepIncrements] CRASH:', err.message, err.stack);
    return null;
  }
}

// Run-level inference-mode control: single point vs. parametric sweep.
/* The run-level sweep toggle was removed: a run becomes a sweep simply by      */
/* setting a flow boundary condition to "sweep" mode in its own setup tree      */
/* (see the flow-BC config in ConfigBody). Sweep-ness is derived via            */
/* runSweepBc / runIsSweep, so there is no separate SweepControl component.      */

/* ====================================================================== */
/* SIDE-BY-SIDE COMPARE VIEW                                              */
/* Replaces the single viewport when ≥2 runs are checked. Shows a small-  */
/* multiple 3D panel per selected run at the chosen monitor's slice plane */
/* (drag any panel to rotate them all in unison), plus an overlaid        */
/* profile plot and a stat table across every selected run. A sweep run   */
/* contributes its median envelope as one representative line.            */
/* ====================================================================== */
function CompareView({ runs, runSel, colorMap, slice, mode, monitorsByGroup, engineType, onSetMode, onClose }) {
  const [cam, setCam] = useState({ ...DEFAULT_CAM });
  const [gridLayout, setGridLayout] = useState('grid');   // 'grid' (side by side) | 'overlay' (superimposed ghosts)
  const [deltaTab, setDeltaTab] = useState('fields');     // 'fields' (A/B/Δ) | 'distortion' (geometry overlay)
  const [diffMon, setDiffMon] = useState(null);           // selected monitor id for the delta difference plot
  try {
    // Resolve every selected id — including synthetic sweep increments (run#i) —
    // into a run-like object, preserving selection order.
    const ordered = [...runSel].map((id) => resolveRunId(runs, id)).filter(Boolean);
    const cm = cmById(colorMap);
    const isDelta = mode === 'delta';
    const dOps = deltaOperands(runs, runSel);

    // Inline element (never an inner component): Grid / Delta switch for the header.
    const modeToggle = (
      <div className="cmp-mode-seg">
        <button className={'cmp-mode-btn' + (!isDelta ? ' sel' : '')} onClick={() => onSetMode && onSetMode('grid')}><Icon name="grid_view" />Grid</button>
        <button className={'cmp-mode-btn' + (isDelta ? ' sel' : '')} disabled={!dOps.ok}
          title={dOps.ok ? 'A − B difference field' : dOps.reason}
          onClick={() => { if (dOps.ok && onSetMode) onSetMode('delta'); }}><Icon name="difference" />Delta</button>
      </div>
    );

    if (ordered.length < 2) {
      return (
        <div className="compare-view" onClick={(e) => e.stopPropagation()}>
          <div className="cmp-head">
            <div className="cmp-title"><Icon name="grid_view" style={{ color: 'var(--color-key-primary)' }} />View predictions</div>
            <button className="icon-btn" style={{ marginLeft: 'auto' }} title="Close" onClick={onClose}><Icon name="close" /></button>
          </div>
          <div className="cmp-empty"><Icon name="grid_view" />Select at least two runs to load their geometries side by side.</div>
        </div>
      );
    }

    /* ----- DELTA MODE: A − B difference field + delta at monitor points ----- */
    if (isDelta) {
      if (!dOps.ok) {
        return (
          <div className="compare-view" onClick={(e) => e.stopPropagation()}>
            <div className="cmp-head">
              <div className="cmp-title"><Icon name="difference" style={{ color: 'var(--color-key-primary)' }} />Delta</div>
              {modeToggle}
              <button className="icon-btn" style={{ marginLeft: 'auto' }} title="Close" onClick={onClose}><Icon name="close" /></button>
            </div>
            <div className="cmp-empty"><Icon name="difference" />{dOps.reason}.</div>
          </div>
        );
      }
      // Reference run (B, the subtrahend): prefer CFD ground truth, then the baseline.
      const ops = dOps.ops;
      const refIdx = ops.findIndex((r) => r.source === 'cfd');
      const baseIdx = ops.findIndex((r) => r.isBaseline);
      const ri = refIdx >= 0 ? refIdx : (baseIdx >= 0 ? baseIdx : 1);
      const B = ops[ri], A = ops[1 - ri];
      const dcm = cmById('delta');
      const mons = ((monitorsByGroup && monitorsByGroup['cfd-mon']) || []).filter((m) => (m.engineId || engineType) === engineType);
      const rep = (st, red) => /max/i.test(red || '') ? st.max : /min/i.test(red || '') ? st.min : /median/i.test(red || '') ? st.median : st.mean;
      const rows = mons.map((m) => {
        const { vis, units, dec } = monitorVis(m);
        // Round A and B to display precision FIRST, then derive Δ from the rounded
        // values so the table always reconciles (A − B == Δ as shown).
        const a = +rep(seriesStats(genSeries(m.id + ':' + A.id, vis, 60)), m.reduction).toFixed(dec);
        const b = +rep(seriesStats(genSeries(m.id + ':' + B.id, vis, 60)), m.reduction).toFixed(dec);
        const d = +(a - b).toFixed(dec);
        const pct = Math.abs(b) > 1e-9 ? (d / b) * 100 : 0;
        return { id: m.id, label: m.label, field: m.field, units, dec, a, b, d, pct };
      });
      // Plain function called directly (inlines elements — not a remounting inner component).
      const abPanel = (r, tag) => (
        <div key={r.id} className="cmp-panel" style={{ boxShadow: `inset 0 0 0 1px ${r.color}66` }}>
          <div className="cmp-panel-head">
            <span className="cmp-ab" style={{ background: r.color }}>{tag}</span>
            <span className="cmp-panel-name">{r.name}</span>
            {r.source === 'cfd'
              ? <span className="run-chip cfd"><Icon name="dataset" />CFD</span>
              : <span className="run-chip"><Icon name="auto_awesome" style={{ fontSize: 11 }} />AI</span>}
          </div>
          <div className="cmp-viewport-wrap">
            <Viewport slice={slice} ann={{ on: false }} cam={cam} setCam={setCam} colorMap={colorMap} sliceLabel={null} />
          </div>
          <div className="cmp-panel-foot"><span>{(r.engineType || 'e40').toUpperCase()}</span><RunStatus status={r.status} /></div>
        </div>
      );
      // ---- P3-4: monitor-location dropdown + difference plot ----
      const selMon = mons.find((m) => m.id === diffMon) || mons[0];
      const dmv = selMon ? monitorVis(selMon) : null;
      const dRow = selMon ? rows.find((r) => r.id === selMon.id) : null;
      let dVals = [], aVals = [], bVals = [], dVis = { min: 0, max: 1 };
      if (selMon && dmv) {
        aVals = genSeries(selMon.id + ':' + A.id, dmv.vis, 60);
        bVals = genSeries(selMon.id + ':' + B.id, dmv.vis, 60);
        dVals = aVals.map((v, i) => v - bVals[i]);
        // Fit the plot to A, B AND Δ together (plus 0) so the absolute profiles
        // and their difference are all visible on one axis.
        const all = [...aVals, ...bVals, ...dVals, 0];
        dVis = { min: Math.min(...all), max: Math.max(...all) };
      }
      const ddc = dRow ? (Math.abs(dRow.d) < (dRow.dec ? 0.05 : 0.5) ? 'var(--color-on-surface-subtle)' : dRow.d > 0 ? '#C2148A' : '#0E8C7E') : 'var(--color-on-surface)';
      // Tab switch: quantitative fields (A/B/Δ) vs. geometric distortion overlay.
      const deltaTabSeg = (
        <div className="cmp-mode-seg" style={{ marginLeft: 0 }}>
          <button className={'cmp-mode-btn' + (deltaTab === 'fields' ? ' sel' : '')} onClick={() => setDeltaTab('fields')}><Icon name="insights" />Fields</button>
          <button className={'cmp-mode-btn' + (deltaTab === 'distortion' ? ' sel' : '')} onClick={() => setDeltaTab('distortion')}><Icon name="view_in_ar" />Distortion</button>
        </div>
      );
      return (
        <div className="compare-view" onClick={(e) => e.stopPropagation()}>
          <div className="cmp-head">
            <div className="cmp-title"><Icon name="difference" style={{ color: 'var(--color-key-primary)' }} />Delta</div>
            <span className="cmp-sub">Δ = {A.name} − {B.name}</span>
            {modeToggle}
            {deltaTabSeg}
            <button className="icon-btn" style={{ marginLeft: 0 }} title="Close" onClick={onClose}><Icon name="close" /></button>
          </div>
          <div className="cmp-scroll">
            {deltaTab === 'fields' ? (
              <>
                <div className="cmp-panels" style={{ gridTemplateColumns: 'repeat(3, minmax(0, 1fr))' }}>
                  {abPanel(A, 'A')}
                  {abPanel(B, 'B')}
                  <div className="cmp-panel" style={{ boxShadow: 'inset 0 0 0 1px var(--color-key-primary)' }}>
                    <div className="cmp-panel-head">
                      <span className="cmp-ab delta">Δ</span>
                      <span className="cmp-panel-name">Difference · A − B</span>
                    </div>
                    <div className="cmp-viewport-wrap">
                      <Viewport slice={slice} ann={{ on: false }} cam={cam} setCam={setCam} colorMap="delta" sliceLabel={null} />
                    </div>
                    <div className="cmp-panel-foot">
                      <span>Δ {cm.field}</span>
                      <span className="cmp-legend-inline" style={{ marginLeft: 'auto' }}>
                        <span style={{ fontFamily: 'Geist Mono, monospace' }}>−</span>
                        <div className="cmp-legend-bar" style={{ width: 64, background: gradCss(dcm.stops, 'to right') }} />
                        <span style={{ fontFamily: 'Geist Mono, monospace' }}>+</span>
                      </span>
                    </div>
                  </div>
                </div>
                {rows.length && selMon ? (
                  <div style={{ borderRadius: 6, background: 'var(--color-container-surface-low)', boxShadow: 'inset 0 0 0 1px var(--color-border-subtle)', overflow: 'hidden' }}>
                    <div className="cmp-delta-title">
                      <Icon name="insights" />Delta at monitor points
                      <div className="select-native" style={{ marginLeft: 'auto', minWidth: 220 }}>
                        <select value={selMon.id} onChange={(e) => setDiffMon(e.target.value)}>
                          {mons.map((m) => <option key={m.id} value={m.id}>{m.label} · {m.field}</option>)}
                        </select>
                        <Icon name="expand_more" />
                      </div>
                    </div>
                    <div className="delta-diff-body">
                      <div className="delta-diff-stats">
                        <div className="dd-stat"><span className="dd-k"><span className="dd-dot" style={{ background: A.color }} />A · {A.name}</span><span className="dd-v">{dRow.a.toFixed(dRow.dec)} {dRow.units}</span></div>
                        <div className="dd-stat"><span className="dd-k"><span className="dd-dot" style={{ background: B.color }} />B · {B.name}</span><span className="dd-v">{dRow.b.toFixed(dRow.dec)} {dRow.units}</span></div>
                        <div className="dd-stat"><span className="dd-k">Δ · {selMon.reduction}</span><span className="dd-v" style={{ color: ddc, fontWeight: 600 }}>{(dRow.d > 0 ? '+' : '') + dRow.d.toFixed(dRow.dec)} {dRow.units}</span></div>
                        <div className="dd-stat"><span className="dd-k">Δ %</span><span className="dd-v" style={{ color: ddc }}>{(dRow.pct > 0 ? '+' : '') + dRow.pct.toFixed(1)}%</span></div>
                      </div>
                      <div className="delta-diff-cap"><Icon name="show_chart" />A, B and their A − B difference across the slice at <b>{selMon.label}</b></div>
                      <ProfilePlot vis={dVis} L={dmv.L} units={dRow.units} dec={dRow.dec} diff
                        series={[
                          { name: 'Δ ' + selMon.field, color: '#C2148A', vals: dVals },
                          { name: 'A · ' + A.name, color: A.color, vals: aVals },
                          { name: 'B · ' + B.name, color: B.color, vals: bVals },
                        ]} />
                    </div>
                  </div>
                ) : (
                  <div className="cmp-hint"><Icon name="info" />No monitors defined for {engineType.toUpperCase()} — add monitors to quantify the delta at specific points.</div>
                )}
                <div className="cmp-hint"><Icon name="insights" />Pick a monitor above to plot the A − B difference along its slice. B defaults to the CFD / baseline reference.</div>
              </>
            ) : (
              <>
                <div className="cmp-panel" style={{ boxShadow: 'inset 0 0 0 1px var(--color-key-primary)' }}>
                  <div className="cmp-panel-head">
                    <span className="cmp-ab delta"><Icon name="view_in_ar" style={{ fontSize: 13 }} /></span>
                    <span className="cmp-panel-name">Geometric distortion · drag to rotate</span>
                  </div>
                  <div className="cmp-viewport-wrap" style={{ minHeight: 380 }}>
                    <Viewport slice={{ axis: null, showPlane: false }} ann={{ on: false }} cam={cam} setCam={setCam} colorMap={colorMap}
                      sliceLabel={null} warp={runWarp(A.id)} ghosts={[{ warp: runWarp(B.id), color: B.color, showDisp: true }]} />
                  </div>
                  <div className="cmp-panel-foot">
                    <span className="cmp-ghost-key"><span className="gk-solid" style={{ background: A.color }} />{A.name} · solid</span>
                    <span className="cmp-ghost-key" style={{ marginLeft: 'auto' }}><span className="gk-dash" style={{ color: B.color }} />{B.name} · ghost</span>
                  </div>
                </div>
                <div className="cmp-hint"><Icon name="view_in_ar" />The dashed wireframe is <b>{B.name}</b> overlaid as a ghost on the solid <b>{A.name}</b>; thin connectors show how each corner moves — the geometric distortion between the two runs.</div>
              </>
            )}
          </div>
        </div>
      );
    }

    /* ----- GRID MODE: side-by-side OR overlaid geometries ----- */
    const cols = Math.min(ordered.length, 3);
    const solid = ordered[0];
    const overlayGhosts = ordered.slice(1).map((r) => ({ warp: runWarp(r.id), color: r.color, showDisp: ordered.length === 2 }));
    // Side by side vs. superimposed-with-ghosts (to see geometric distortion).
    const gridLayoutSeg = (
      <div className="cmp-mode-seg" style={{ marginLeft: 0 }}>
        <button className={'cmp-mode-btn' + (gridLayout === 'grid' ? ' sel' : '')} onClick={() => setGridLayout('grid')}><Icon name="grid_view" />Side by side</button>
        <button className={'cmp-mode-btn' + (gridLayout === 'overlay' ? ' sel' : '')} onClick={() => setGridLayout('overlay')}><Icon name="layers" />Overlay</button>
      </div>
    );
    return (
      <div className="compare-view" onClick={(e) => e.stopPropagation()}>
        <div className="cmp-head">
          <div className="cmp-title"><Icon name="grid_view" style={{ color: 'var(--color-key-primary)' }} />View predictions</div>
          <span className="cmp-sub">{ordered.length} predictions · drag {gridLayout === 'overlay' ? 'to rotate' : 'any panel to rotate all in unison'}</span>
          {modeToggle}
          {gridLayoutSeg}
          <div className="cmp-legend-inline">
            <div className="cmp-legend-bar" style={{ background: gradCss(cm.stops, 'to right') }} />
            <span>{cm.field} · {cm.units}</span>
          </div>
          <button className="icon-btn" style={{ marginLeft: 0 }} title="Close" onClick={onClose}><Icon name="close" /></button>
        </div>

        <div className="cmp-scroll">
          {gridLayout === 'grid' ? (
            <>
              <div className="cmp-panels" style={{ gridTemplateColumns: `repeat(${cols}, minmax(0, 1fr))` }}>
                {ordered.map((r) => {
                  const sweep = runIsSweep(r);
                  return (
                    <div key={r.id} className="cmp-panel" style={{ boxShadow: `inset 0 0 0 1px ${r.color}66` }}>
                      <div className="cmp-panel-head">
                        <span className="run-swatch" style={{ background: r.color, height: 14 }} />
                        <span className="cmp-panel-name">{r.name}</span>
                        {r.source === 'cfd'
                          ? <span className="run-chip cfd"><Icon name="dataset" />CFD</span>
                          : <span className="run-chip"><Icon name="auto_awesome" style={{ fontSize: 11 }} />AI</span>}
                        {sweep && <span className="run-chip sweep"><Icon name="tune" />sweep</span>}
                      </div>
                      <div className="cmp-viewport-wrap">
                        <Viewport slice={slice} ann={{ on: false }} cam={cam} setCam={setCam} colorMap={colorMap} sliceLabel={null} />
                      </div>
                      <div className="cmp-panel-foot">
                        <span>{(r.engineType || 'e40').toUpperCase()}</span>
                        <RunStatus status={r.status} />
                      </div>
                    </div>
                  );
                })}
              </div>
              <div className="cmp-hint"><Icon name="insights" />Compare monitor values, slice profiles and stat tables in the <b>Monitors</b> tab — or switch to <b>Overlay</b> to see geometric distortion.</div>
            </>
          ) : (
            <>
              <div className="cmp-panel" style={{ boxShadow: 'inset 0 0 0 1px var(--color-key-primary)' }}>
                <div className="cmp-panel-head">
                  <span className="run-swatch" style={{ background: solid.color, height: 14 }} />
                  <span className="cmp-panel-name">Overlaid geometries · {ordered.length}</span>
                </div>
                <div className="cmp-viewport-wrap" style={{ minHeight: 380 }}>
                  <Viewport slice={{ axis: null, showPlane: false }} ann={{ on: false }} cam={cam} setCam={setCam} colorMap={colorMap}
                    sliceLabel={null} warp={runWarp(solid.id)} ghosts={overlayGhosts} />
                </div>
                <div className="cmp-panel-foot" style={{ flexWrap: 'wrap', gap: '6px 14px', height: 'auto', padding: '8px 10px' }}>
                  <span className="cmp-ghost-key"><span className="gk-solid" style={{ background: solid.color }} />{solid.name} · solid</span>
                  {ordered.slice(1).map((r) => <span key={r.id} className="cmp-ghost-key"><span className="gk-dash" style={{ color: r.color }} />{r.name} · ghost</span>)}
                </div>
              </div>
              <div className="cmp-hint"><Icon name="layers" />The first run is drawn solid; every other run is overlaid as a dashed ghost wireframe so you can read the geometric change between set-ups{ordered.length === 2 ? ' (connectors show corner displacement)' : ''}.</div>
            </>
          )}
        </div>
      </div>
    );
  } catch (err) {
    console.error('[CompareView] CRASH:', err.message, err.stack);
    return (
      <div className="compare-view" onClick={(e) => e.stopPropagation()}>
        <div className="cmp-head"><div className="cmp-title"><Icon name="grid_view" />View predictions</div><button className="icon-btn" style={{ marginLeft: 'auto' }} onClick={onClose}><Icon name="close" /></button></div>
        <div className="cmp-empty"><Icon name="error_outline" />Unable to render predictions.</div>
      </div>
    );
  }
}

function App() {
  // ---- RUNS: the sidebar is a list of runs; one is "open" (accordion) for setup ----
  const [runs, setRuns] = useState(INITIAL_RUNS);
  const [activeRunId, setActiveRunId] = useState('baseline'); // which run's setup tree is expanded
  const [runSel, setRunSel] = useState(() => new Set());      // runs checked for comparison
  const [compareOpen, setCompareOpen] = useState(false);      // side-by-side "view predictions" active
  const [compareMode, setCompareMode] = useState('grid');     // 'grid' (side-by-side) | 'delta' (A−B difference)

  // inner setup-tree state (only one run is open at a time, so this is shared)
  const [expanded, setExpanded] = useState(DEFAULT_EXPANDED);
  const [selected, setSelected] = useState('geo-file');

  const activeRun = runs.find((r) => r.id === activeRunId) || null;
  // The setup tree + config dock operate on the active run's own config.
  const engineType = activeRun ? activeRun.engineType : 'e40';
  const enabled = activeRun ? activeRun.enabled : defaultEnabled();
  const bcConfig = activeRun ? activeRun.bcConfig : makeBcConfig();

  const patchRun = (id, patch) => setRuns((prev) => prev.map((r) => (r.id === id ? { ...r, ...(typeof patch === 'function' ? patch(r) : patch) } : r)));
  const patchActiveRun = (patch) => { if (activeRunId) patchRun(activeRunId, patch); };
  const setEngineType = (t) => patchActiveRun({ engineType: t });
  const setBC = (nid, patch) => patchActiveRun((r) => ({ bcConfig: { ...r.bcConfig, [nid]: { ...r.bcConfig[nid], ...patch } } }));
  const bcSummaryById = Object.fromEntries(Object.entries(bcConfig).map(([id, cfg]) => [id, bcSummary(cfg)]));

  // run-list actions
  const toggleRunOpen = (id) => { setActiveRunId((cur) => (cur === id ? null : id)); setSelected('geo-file'); };
  const toggleRunSel = (id) => setRunSel((prev) => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const addRun = () => {
    try {
      const id = 'run' + Date.now();
      const color = RUN_COLORS[runs.length % RUN_COLORS.length];
      setRuns((prev) => [...prev, { id, name: 'New run ' + (prev.length + 1), color, engineType: 'e40', status: 'draft', source: 'ai', cfd: null, kind: 'single', sweep: null, enabled: defaultEnabled(), bcConfig: makeBcConfig() }]);
      setActiveRunId(id); setSelected('geo-file');
    } catch (err) { console.error('[addRun] CRASH:', err.message, err.stack); }
  };
  const renameRun = (id, name) => patchRun(id, { name });
  const removeRun = (id) => setRuns((prev) => { const next = prev.filter((r) => r.id !== id); if (activeRunId === id) setActiveRunId(next[0] ? next[0].id : null); setRunSel((s) => { const n = new Set(s); n.delete(id); return n; }); return next; });
  const predictRun = (id) => patchRun(id, { status: 'predicted' });
  // Data source: AI surrogate inference vs imported CFD/sim dataset (per run).
  const setRunSource = (src) => patchActiveRun((r) => (src === 'cfd'
    ? { source: 'cfd', status: r.cfd ? 'imported' : 'draft' }
    : { source: 'ai', cfd: null, status: 'ready' }));
  const importCfd = (meta) => patchActiveRun({ source: 'cfd', cfd: meta, status: 'imported' });
  const clearCfd = () => patchActiveRun({ cfd: null, status: 'draft' });
  const openCompare = () => { if (runSel.size >= 2) { setCompareMode('grid'); setCompareOpen(true); } };
  const openDelta = () => { if (deltaOperands(runs, runSel).ok) { setCompareMode('delta'); setCompareOpen(true); } };

  const [monitorsByGroup, setMonitorsByGroup] = useState({
    'cfd-mon': [
      { id: 'mon-press', label: 'Pressure · Mid-plane', field: 'Pressure', units: 'kPa', reduction: 'Area-weighted avg', axis: 'z', pos: 80, extent: '200×120mm', engineId: 'e40',
        slice: { axis: 'z', pos: { x: 100, y: 60, z: 80 }, ranges: { x: [0, 200], y: [0, 120], z: [0, 160] }, flip: false, showPlane: true } },
      { id: 'mon-vel', label: 'Velocity · Outlet', field: 'Velocity', units: 'm/s', reduction: 'Max', axis: 'x', pos: 180, extent: '120×160mm', engineId: 'e40',
        slice: { axis: 'x', pos: { x: 180, y: 60, z: 80 }, ranges: { x: [0, 200], y: [0, 120], z: [0, 160] }, flip: false, showPlane: true } },
      { id: 'mon-e30inlet', label: 'Pressure · Inlet', field: 'Pressure', units: 'kPa', reduction: 'Area-weighted avg', axis: 'x', pos: 20, extent: '120×160mm', engineId: 'e30',
        slice: { axis: 'x', pos: { x: 20, y: 60, z: 80 }, ranges: { x: [0, 200], y: [0, 120], z: [0, 160] }, flip: true, showPlane: true } },
    ],
    'fea-results': [],
  });

  // viewer state
  const [theme, setTheme] = useState('dark');
  const [menu, setMenu] = useState(null);
  const [slicerOpen, setSlicerOpen] = useState(false);
  const [slice, setSlice] = useState(DEFAULT_SLICE);
  const [cam, setCam] = useState({ ...DEFAULT_CAM });
  const [colorMap, setColorMap] = useState('temperature');
  const [views, setViews] = useState(SEED_VIEWS);
  const [viewLibs, setViewLibs] = useState(SEED_VIEW_LIBS);
  const [selectedView, setSelectedView] = useState(null);
  const [selectedMonitor, setSelectedMonitor] = useState(null);
  const [ann, setAnn] = useState({ on: false, max: true, min: true, mean: false });

  useEffect(() => { document.documentElement.classList.toggle('light', theme === 'light'); }, [theme]);

  const toggleExpand = (id) => setExpanded((prev) => {
    const n = new Set(prev);
    if (n.has(id)) n.delete(id); else n.add(id);
    return n;
  });
  const toggleEnabled = (id) => patchActiveRun((r) => ({ enabled: { ...r.enabled, [id]: r.enabled[id] === false ? true : false } }));

  const resolveNode = (id) => {
    const inTree = findNode(TREE, id);
    if (inTree) return inTree;
    for (const g of Object.keys(monitorsByGroup)) {
      const m = monitorsByGroup[g].find((x) => x.id === id);
      if (m) return { id: m.id, label: m.label, icon: 'timeline', type: 'monitor', _mon: m, _group: g };
    }
    return null;
  };
  const selNode = selected ? resolveNode(selected) : null;
  const activeMonName = selNode && selNode.type === 'monitor' ? selNode.label : null;

  // When a monitor is selected, drive the viewer to its exact slice so you can
  // see *where* on the geometry it measures.
  useEffect(() => {
    try {
      const node = selected ? resolveNode(selected) : null;
      if (node && node.type === 'monitor' && node._mon && node._mon.slice) {
        const m = node._mon;
        setSlice({ ...JSON.parse(JSON.stringify(m.slice)), showPlane: true });
        setSelectedMonitor(m.id);
        const cm = COLORMAPS.find((c) => c.field === m.field);
        if (cm) setColorMap(cm.id);
      }
    } catch (err) {
      console.error('[locateMonitor] CRASH:', err.message, err.stack);
    }
  }, [selected]);

  // If the run's engine changes, drop a selection that no longer belongs to it.
  useEffect(() => {
    const node = selected ? resolveNode(selected) : null;
    if (node && node.type === 'monitor' && node._mon && (node._mon.engineId || engineType) !== engineType) {
      setSelected(null);
      setSelectedMonitor(null);
    }
  }, [engineType]);

  const addMonitor = (groupId) => {
    try {
      const n = (monitorsByGroup[groupId] ? monitorsByGroup[groupId].length : 0) + 1;
      const id = 'mon' + Date.now();
      const isFea = groupId === 'fea-results';
      const mon = isFea
        ? { id, label: 'Stress probe ' + n, field: 'von Mises', units: 'MPa', reduction: 'Peak', axis: 'y', pos: 60, extent: '200×160mm', engineId: engineType,
            slice: { axis: 'y', pos: { x: 100, y: 60, z: 80 }, ranges: { x: [0, 200], y: [0, 120], z: [0, 160] }, flip: false, showPlane: true } }
        : { id, label: 'Monitor ' + n, field: 'Pressure', units: 'kPa', reduction: 'Area-weighted avg', axis: 'z', pos: 80, extent: '200×120mm', engineId: engineType,
            slice: { axis: 'z', pos: { x: 100, y: 60, z: 80 }, ranges: { x: [0, 200], y: [0, 120], z: [0, 160] }, flip: false, showPlane: true } };
      setMonitorsByGroup((prev) => ({ ...prev, [groupId]: [...(prev[groupId] || []), mon] }));
      setExpanded((prev) => new Set(prev).add(groupId));
      setSelected(id);
    } catch (err) {
      console.error('[addMonitor] CRASH:', err.message, err.stack);
    }
  };
  const removeMonitor = (groupId, id) => {
    setMonitorsByGroup((prev) => ({ ...prev, [groupId]: (prev[groupId] || []).filter((m) => m.id !== id) }));
    setSelected(null);
  };
  const renameMonitor = (groupId, id, name) => {
    setMonitorsByGroup((prev) => ({ ...prev, [groupId]: (prev[groupId] || []).map((m) => (m.id === id ? { ...m, label: name } : m)) }));
  };

  // Turn the current slice into a saved monitor in the active engine's CFD library.
  const createMonitor = () => {
    try {
      if (!slice.axis) return;
      const ax = slice.axis;
      const [o1, o2] = orthosOf(ax);
      const w = Math.round(slice.ranges[o1][1] - slice.ranges[o1][0]);
      const h = Math.round(slice.ranges[o2][1] - slice.ranges[o2][0]);
      const cm = cmById(colorMap);
      const id = 'm' + Date.now();
      const m = {
        id,
        label: `${cm.field} · ${ax.toUpperCase()} @ ${Math.round(slice.pos[ax])}mm`,
        field: cm.field,
        units: cm.units,
        reduction: 'Area-weighted avg',
        axis: ax,
        pos: Math.round(slice.pos[ax]),
        extent: `${w}×${h}mm`,
        engineId: engineType,
        slice: { ...JSON.parse(JSON.stringify(slice)), showPlane: true },
      };
      setMonitorsByGroup((prev) => ({ ...prev, 'cfd-mon': [...(prev['cfd-mon'] || []), m] }));
      setExpanded((prev) => new Set(prev).add('cfd-mon'));
      setSelected(id);
      setSelectedMonitor(id);
    } catch (err) {
      console.error('[createMonitor] CRASH:', err.message, err.stack);
    }
  };

  // Selecting a monitor in the panel selects it in the tree; the locate effect
  // then drives the viewer to its slice.
  const applyMonitor = (id) => setSelected(id);

  const applyView = (id) => {
    const v = views.find((x) => x.id === id);
    if (!v) return;
    setSelectedView(id);
    setCam({ ...v.cam });
    setColorMap(v.colorMap);
    setAnn({ ...v.ann });
  };

  const saveView = (name, libId) => {
    const id = 'uv' + Date.now();
    const v = { id, libId, name, cam: { ...cam }, colorMap, ann: { ...ann } };
    setViews((prev) => [...prev, v]);
    setSelectedView(id);
  };

  const deleteView = (id) => {
    setViews((prev) => prev.filter((v) => v.id !== id));
    if (selectedView === id) setSelectedView(null);
  };

  const createViewLib = (name) => {
    const id = 'ul' + Date.now();
    setViewLibs((prev) => [...prev, { id, name }]);
    return id;
  };

  // Deleting a library also discards the views inside it.
  const deleteViewLib = (id) => {
    setViews((prev) => {
      const doomed = prev.filter((v) => v.libId === id).map((v) => v.id);
      if (doomed.includes(selectedView)) setSelectedView(null);
      return prev.filter((v) => v.libId !== id);
    });
    setViewLibs((prev) => prev.filter((l) => l.id !== id));
  };

  const cycleColorMap = () => {
    const fields = COLORMAPS.filter((c) => c.id !== 'delta'); // delta is not a selectable field map
    const i = fields.findIndex((c) => c.id === colorMap);
    setColorMap(fields[(i + 1) % fields.length].id);
  };

  const openSlicer = () => { setSlicerOpen(true); setMenu(null); setSlice((s) => ({ ...s, axis: s.axis ?? 'z' })); };
  // Open the Monitors tab; optionally focus a specific monitor's results.
  const openMonitors = (id) => { if (typeof id === 'string') setSelected(id); setMenu('monitors'); };
  // Drive the viewer to a monitor's plane and surface the Monitors panel.
  const locateMonitor = (m) => {
    try {
      if (m && m.slice) {
        setSlice({ ...JSON.parse(JSON.stringify(m.slice)), showPlane: true });
        const cm = COLORMAPS.find((c) => c.field === m.field);
        if (cm) setColorMap(cm.id);
      }
      if (m) setSelectedMonitor(m.id);
      setMenu('monitors');
    } catch (err) {
      console.error('[locateMonitor] CRASH:', err.message, err.stack);
    }
  };
  const toggleMenu = (m) => setMenu((c) => (c === m ? null : m));
  const activeCm = cmById(colorMap);

  return (
    <div className="app">
      {/* ---------- LEFT: runs-list sidebar ---------- */}
      <aside className="sidebar">
        <div className="sb-header">
          <div className="ttl-wrap">
            <div className="ttl">Prediction runs</div>
            <div className="ttl-sub">{runs.length} runs{runSel.size ? ` · ${runSel.size} selected` : ''} · E40 cooling study</div>
          </div>
          <button className="sb-icon" title="New run" onClick={addRun}><Icon name="add" /></button>
          <button className="sb-icon" title="More"><Icon name="more_horiz" /></button>
        </div>

        <div className="runs-list">
          {runs.map((run) => (
            <div key={run.id} className={'run-item' + (activeRunId === run.id ? ' open' : '')}>
              <RunRow run={run} open={activeRunId === run.id} checked={runSel.has(run.id)}
                canDelete={runs.length > 1}
                onToggleOpen={toggleRunOpen} onToggleSel={toggleRunSel} onDelete={removeRun} />
              {activeRunId === run.id && (
                <div className="run-setup">
                  {runIsSweep(run) && (
                    <SweepIncrements run={run} runSel={runSel} onToggleInc={toggleRunSel} />
                  )}
                  <div className="tree">
                    {TREE.map((n) => (
                      <TreeNode key={n.id} node={n} depth={0} expanded={expanded} toggleExpand={toggleExpand}
                        selected={selected} onSelect={setSelected} enabled={enabled} toggleEnabled={toggleEnabled} disabled={false}
                        monitorsByGroup={monitorsByGroup} onAddMonitor={addMonitor} engineType={engineType} bcSummaryById={bcSummaryById} />
                    ))}
                  </div>
                </div>
              )}
            </div>
          ))}
          <button className="run-add-btn" onClick={addRun}><Icon name="add" />New run</button>
        </div>

        {activeRun && selNode && (
          <div className="config-dock">
            <div className="cfg-header">
              <span className="cfg-chip"><Icon name={selNode.icon} /></span>
              <div className="cfg-titles">
                <div className="cfg-title">{selNode.label}</div>
                <div className="cfg-caption">{activeRun.name} · {TYPE_CAPTION[selNode.type] || 'Configuration'}</div>
              </div>
              <button className="sb-icon" title="Close" onClick={() => setSelected(null)}><Icon name="close" /></button>
            </div>
            <div className="cfg-body" key={activeRunId + ':' + selected}>
              <ConfigBody node={selNode} engineType={engineType} setEngineType={setEngineType}
                enabled={enabled} toggleEnabled={toggleEnabled} monitorsByGroup={monitorsByGroup}
                bcConfig={bcConfig} source={activeRun.source || 'ai'} cfd={activeRun.cfd}
                actions={{ openMonitors, openSlicer, addMonitor, removeMonitor, locateMonitor, renameMonitor, setBC, setRunSource, importCfd, clearCfd }} />
            </div>
          </div>
        )}

        <div className="predict-bar">
          {runSel.size >= 2 ? (
            <>
              <div className="predict-ctx">{runSel.size} runs selected{runSel.size === 2 ? ' · view side by side or take a delta' : ' · load geometries side by side'}</div>
              <button className="predict" onClick={openCompare}><Icon name="grid_view" />View {runSel.size} predictions</button>
              {runSel.size === 2 && (() => {
                const dOps = deltaOperands(runs, runSel);
                return (
                  <button className={'predict predict-secondary' + (dOps.ok ? '' : ' predict-disabled')} disabled={!dOps.ok}
                    title={dOps.ok ? 'A − B difference field' : dOps.reason} onClick={openDelta} style={{ marginTop: 8 }}>
                    <Icon name="difference" />Create delta
                  </button>
                );
              })()}
            </>
          ) : activeRun ? (() => {
            if (activeRun.source === 'cfd') {
              const has = !!activeRun.cfd;
              return (
              <>
                <div className="predict-ctx">{activeRun.name} · {has ? 'CFD dataset' : 'CFD — no dataset'} · {activeRun.engineType.toUpperCase()}</div>
                <button className="predict predict-disabled" disabled>
                  <Icon name={has ? 'dataset' : 'upload_file'} />{has ? 'Imported · no prediction needed' : 'Import a CFD dataset'}
                </button>
              </>
              );
            }
            const sb = runSweepBc(activeRun);
            return (
            <>
              <div className="predict-ctx">{activeRun.name} · {sb ? sweepSummary(activeRun) : 'single point'} · {activeRun.engineType.toUpperCase()}</div>
              <button className="predict" onClick={() => predictRun(activeRun.id)}>
                <Icon name="bolt" />{sb ? `Predict sweep · ${incrementsOf(sb.min, sb.max, sb.steps).length} runs` : 'Predict'}
              </button>
            </>
            );
          })() : (
            <button className="predict predict-disabled" disabled><Icon name="bolt" />Open a run to set it up</button>
          )}
        </div>
      </aside>

      {/* ---------- RIGHT: geometry viewer ---------- */}
      <div className="main">
        <div className="navbar" onClick={(e) => e.stopPropagation()}>
          <span className="brand">PhysicsX</span><span className="brand-sub">· Evaluate</span>
          <NavTrigger label="Parts" />
          <div className="menu-wrap">
            <NavTrigger label="Color Map" open={menu === 'colormap'} onClick={() => toggleMenu('colormap')}
              leading={<span className="swatch-dot" style={{ background: gradCss(activeCm.stops, 'to right') }} />} />
            {menu === 'colormap' && <ColorMapPanel colorMap={colorMap} onSelect={(id) => { setColorMap(id); }} />}
          </div>
          <div className="spacer" />
          <div className="menu-wrap">
            <NavTrigger label="Views" open={menu === 'views'} onClick={() => toggleMenu('views')} />
            {menu === 'views' && (
              <ViewsPanel views={views} libs={viewLibs} selectedView={selectedView}
                onApply={applyView} onSaveView={saveView} onDeleteView={deleteView}
                onCreateLib={createViewLib} onDeleteLib={deleteViewLib}
                ann={ann} setAnn={setAnn} />
            )}
          </div>
          <div className="menu-wrap">
            <NavTrigger label="Monitors" accent open={menu === 'monitors'} onClick={() => toggleMenu('monitors')} />
            {menu === 'monitors' && (
              <MonitorsPanel slice={slice} monitorsByGroup={monitorsByGroup} engineType={engineType} selected={selected}
                runs={runs} compareSel={runSel}
                onSelect={(id) => { applyMonitor(id); }} onCreate={createMonitor} onOpenSlicer={openSlicer} />
            )}
          </div>
          <button className="icon-btn" style={{ marginLeft: 8 }} onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}>
            <Icon name={theme === 'dark' ? 'light_mode' : 'dark_mode'} />
          </button>
        </div>

        <div className="stage" onClick={() => setMenu(null)}>
          {compareOpen ? (
            <CompareView runs={runs} runSel={runSel} colorMap={colorMap} slice={slice} mode={compareMode}
              monitorsByGroup={monitorsByGroup} engineType={engineType}
              onSetMode={setCompareMode} onClose={() => setCompareOpen(false)} />
          ) : (
            <>
              <Viewport slice={slice} ann={ann} cam={cam} setCam={setCam} colorMap={colorMap} sliceLabel={activeMonName} />
              <Legend colorMap={colorMap} />

              <div className="cam-ctrl" onClick={(e) => e.stopPropagation()} onMouseDown={(e) => e.stopPropagation()}>
                <button className="icon-btn" title="Zoom out" onClick={() => setCam((c) => ({ ...c, zoom: clamp(c.zoom * 0.85, 0.5, 4) }))}><Icon name="remove" /></button>
                <button className="icon-btn" title="Reset view" onClick={() => setCam({ ...DEFAULT_CAM })}><Icon name="filter_center_focus" /></button>
                <button className="icon-btn" title="Zoom in" onClick={() => setCam((c) => ({ ...c, zoom: clamp(c.zoom * 1.18, 0.5, 4) }))}><Icon name="add" /></button>
              </div>

              {slicerOpen && <SlicerPanel slice={slice} setSlice={setSlice} onSaveMonitor={createMonitor} />}
              <div className="tools" onClick={(e) => e.stopPropagation()} onMouseDown={(e) => e.stopPropagation()}>
                <button className={'tool' + (slicerOpen ? ' active' : '')} onClick={() => setSlicerOpen((o) => !o)}><Icon name="content_cut" />Slice</button>
                <button className="tool" onClick={cycleColorMap} title="Cycle color map"><Icon name="palette" />{activeCm.name}</button>
                <button className="tool"><Icon name="layers" />Parts</button>
              </div>
              <div className="hint">Drag to rotate · scroll to zoom.<br />Pick a <b>Color Map</b>, then <b>save a View</b>.</div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
